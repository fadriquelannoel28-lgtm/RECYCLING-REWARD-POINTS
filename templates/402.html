{% extends 'base.html' %}

{% block content %}
<main class="py-5 my-auto">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="card border-0 shadow-sm rounded-1 p-4 p-md-5 text-center bg-white gap-2 mb-3">
          <div class="mx-auto mb-3 d-inline-flex align-items-center justify-content-center rounded-circle" style="width: 72px; height: 72px; background-color: rgba(245, 158, 11, 0.14); color: #b45309;">
            <i class="bi bi-wifi-off fs-1"></i>
          </div>
          <h1 class="fw-bold mb-1" style="color: var(--eco-forest);">402</h1>
          <h5 class="fw-bold text-dark mb-2">Connection Interrupted</h5>
          <p class="text-muted small mb-4">
            Looks like you got to another page or lost connection to the station.
          </p>
          <div class="d-flex flex-wrap gap-2 justify-content-center">
            <a href="{{ url_for('index') }}" class="btn btn-forest btn-pill px-4">
              <i class="bi bi-house me-1"></i>
              <span>Back to Home</span>
            </a>
            <button type="button" onclick="window.location.reload();" class="btn btn-outline-success btn-pill px-4">
              <i class="bi bi-arrow-clockwise me-1"></i>
              <span>Retry</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
{% endblock %}
