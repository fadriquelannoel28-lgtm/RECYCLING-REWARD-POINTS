{% extends 'base.html' %}

{% block content %}
<main class="py-5 my-auto">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5 col-xl-4">
        <div class="card border-0 shadow-sm p-4 p-md-5 bg-white">
          <div class="text-center mb-4">
            <span class="eco-brand-badge mb-3" style="width: 48px; height: 48px;">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
                <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
              </svg>
            </span>
            <h3 class="fw-bold">Create Account</h3>
            <p class="text-muted small">Join EcoCoins and earn rewards for recycling</p>
          </div>

          {% if error %}
            <div class="alert alert-danger py-2 small rounded-3">{{ error }}</div>
          {% endif %}

          <form action="{{ url_for('register') }}" method="POST">
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label small fw-semibold">First Name</label>
                <input type="text" name="first_name" class="form-control" placeholder="Juan" value="{{ first_name|default('') }}" required>
              </div>
              <div class="col-6">
                <label class="form-label small fw-semibold">Last Name</label>
                <input type="text" name="last_name" class="form-control" placeholder="Dela Cruz" value="{{ last_name|default('') }}" required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Email Address</label>
              <input type="email" name="email" class="form-control" placeholder="name@example.com" value="{{ email|default('') }}" required>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Password</label>
              <div class="input-group">
                <input type="password" name="password" id="regPass" class="form-control" placeholder="Create password" required>
                <button type="button" class="btn btn-outline-secondary toggle-password" data-target="regPass">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Confirm Password</label>
              <div class="input-group">
                <input type="password" name="confirm_password" id="regConfirmPass" class="form-control" placeholder="Repeat password" required>
                <button type="button" class="btn btn-outline-secondary toggle-password" data-target="regConfirmPass">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" name="terms" id="termsCheck" required>
              <label class="form-check-label small text-muted" for="termsCheck">
                I agree to the <a href="#" class="text-success text-decoration-none">Terms and Conditions</a>
              </label>
            </div>

            <button type="submit" class="btn btn-accent w-100 py-2 fw-bold mb-3 btn-pill">
              <span>Create Resident Account</span>
              <i class="bi bi-arrow-right ms-1"></i>
            </button>

            <div class="text-center small text-muted">
              Already have an account? <a href="{{ url_for('login') }}" class="fw-bold text-decoration-none" style="color: var(--eco-forest);">Login</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>
{% endblock %}
