{% extends 'base.html' %}

{% block content %}
<main class="py-5 my-auto">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 text-center bg-white">
          <div class="mx-auto mb-3 d-inline-flex align-items-center justify-content-center rounded-circle" style="width: 72px; height: 72px; background-color: rgba(25, 135, 84, 0.1); color: var(--eco-forest);">
            <i class="bi bi-compass fs-1"></i>
          </div>
          <h1 class="fw-bold mb-1" style="color: var(--eco-forest);">404</h1>
          <h5 class="fw-bold text-dark mb-2">Page Not Found</h5>
          <p class="text-muted small mb-4">
            The page you're looking for doesn't exist or has been moved.
          </p>
          <div class="d-flex justify-content-center">
            <a href="{{ url_for('index') }}" class="btn btn-forest btn-pill px-4">
              <i class="bi bi-house me-1"></i>
              <span>Back to Home</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
{% endblock %}
