{% extends 'base.html' %}

{% block content %}
<main class="py-5 my-auto">
  <div class="container text-center">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card border-0 shadow-sm p-4 p-md-5 bg-white">
          <div class="mb-4">
            <span class="badge bg-danger-subtle text-danger fs-6 px-3 py-2 rounded-pill fw-bold mb-3">404 Error</span>
            <div class="display-1 fw-bold text-success my-2">404</div>
            <i class="bi bi-compass fs-1 text-muted d-block mb-3"></i>
            <h2 class="fw-bold mb-2">Page Not Found</h2>
            <p class="text-muted">
              The page you are looking for doesn't exist or has been moved to another location.
            </p>
          </div>

          <div class="d-flex flex-wrap gap-2 justify-content-center">
            <a href="{{ url_for('index') }}" class="btn btn-success px-4 py-2">
              <i class="bi bi-house me-1"></i> Return to Home
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
{% endblock %}
